<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合作試玩室</title>
<style>
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --ink:#1F2329; --sub:#8B9098; --line:#EEF0F3;
  --accent:#17B97F; --accent-l:#E2F6EE;
  --blue:#5B9BF5; --orange:#FF9A5C; --yellow:#FFC93C; --green:#5CC08A; --purple:#9B87F5;
  --gc:#FF8FA3; --gl:#FFE4EA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{margin:0;background:#EEF1F4}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);font-size:17px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:active{transform:scale(.97)}
input{font:inherit;-webkit-user-select:text;user-select:text}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
#v-game{padding-bottom:100px}
#v-guide{padding-bottom:40px}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hide{display:none!important}
.gi{display:inline-grid;place-items:center}
.gi svg{width:100%;height:100%}
.i3{width:52px;height:52px;flex:none}
.i3 svg{width:100%;height:100%;overflow:visible}

/* ---------- Progress track (shared) ---------- */
.track-wrap{position:relative;padding:0 6px}
.railbox{position:relative;margin:0 12px;height:12px}
.rail{position:absolute;inset:0;border-radius:12px;background:rgba(255,255,255,.75)}
.rail .fill{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:var(--accent);transition:width .35s}
.dots{position:absolute;inset:0}
.dot{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.08);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--sub);transition:.25s}
.dot.done{background:var(--accent);color:#fff}
.dot.on{width:40px;height:40px;margin:-20px 0 0 -20px;background:#fff;color:var(--accent);box-shadow:0 0 0 4px var(--accent),0 6px 14px rgba(0,0,0,.08);font-size:15px}
.labels{position:relative;height:24px;margin:22px 12px 0}
.labels span{position:absolute;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.labels span.on{color:var(--ink)}
.tip{position:relative;margin:0 0 26px;background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.06);font-size:15px;font-weight:700;line-height:1.5;padding:11px 16px;border-radius:14px;text-align:center;animation:fade .25s}
.tip::after{content:"";position:absolute;left:var(--ax);bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff;transition:left .3s}

/* ---------- Home ---------- */
.htop{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 0}
.hbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:800}
.hbtn .gi{width:16px;height:16px}
#v-home{padding-bottom:36px}
.logo{font-size:22px;font-weight:900;color:var(--accent);letter-spacing:.02em}
.hero{position:relative;padding:22px 20px 4px;min-height:200px}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);font-size:13px;font-weight:800}
.hero h1{margin:12px 0 0;font-size:26px;line-height:1.35;font-weight:800;max-width:55%}
.hero .hsub{margin:10px 0 0;font-size:15px;color:var(--sub);max-width:52%;line-height:1.5}
.hmas{position:absolute;right:14px;top:20px;width:160px;display:flex;flex-direction:column;align-items:center}
.bubble{position:relative;background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:800;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:12px;align-self:flex-end}
.bubble b{color:var(--accent)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.hmas img{width:132px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.10));animation:bob 3s ease-in-out infinite}
.gtop{padding:20px 20px 0}
.gtop .circ{background:var(--soft)}
.ghd{display:flex;align-items:flex-end;justify-content:space-between}
.ghd img{width:96px;margin-bottom:-6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:26px 20px 14px}
.sec-h h2{margin:0;font-size:20px;font-weight:800}
.sec-h button{font-size:15px;font-weight:700;color:var(--accent)}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.gcard{position:relative;aspect-ratio:3/4;border-radius:22px;background:var(--l);padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;overflow:hidden;text-align:left}
.gcard h3{align-self:flex-start;margin:0;font-size:17px;font-weight:800}
.gcard .gchar{flex:1 1 0;min-height:0;width:80%;object-fit:contain;margin:6px 0 10px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.10))}
.gcard .gtag{padding:6px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--c);font-size:13px;font-weight:700;white-space:nowrap}
.spk{position:absolute;width:12px;height:12px;background:var(--c);opacity:.55;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.spk.s1{right:16px;top:20px}.spk.s2{left:16px;top:54%;width:8px;height:8px;opacity:.4}
.prin{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.prin div{background:var(--soft);border-radius:18px;padding:16px}
.prin b{display:block;font-size:16px;font-weight:800}
.prin small{display:block;margin-top:4px;font-size:14px;color:var(--sub);line-height:1.45}
.wcard{background:#fff;border-radius:22px;margin:0 16px;padding:8px 20px;border:1px solid var(--line)}
.pill{flex:none;padding:8px 14px;border-radius:999px;background:var(--soft);font-size:15px;font-weight:700}

/* ---------- Game intro ---------- */
.ghero{position:relative;padding:22px 20px 30px;overflow:hidden}
.ghero .top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.circ{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px}
.ghero .tt{position:relative;z-index:2;margin-top:20px}
.ghero .tt small{font-size:15px;font-weight:700;color:rgba(31,35,41,.55)}
.ghero .tt h1{margin:6px 0 0;font-size:32px;font-weight:800}
.ghero .gchar{position:absolute;right:0;bottom:-8px;width:96px;height:96px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 8px rgba(0,0,0,.10));animation:bob 3.4s ease-in-out infinite}
.ghero .track-wrap{margin-top:8px}
.gsheet{background:#fff;border-radius:28px 28px 0 0;margin-top:-14px;padding:26px 20px 30px;min-height:50vh;position:relative}
.tagline{margin:0;font-size:17px;line-height:1.7;font-weight:700}
.winbar{width:100%;display:flex;align-items:center;gap:14px;border-radius:18px;padding:16px 18px;margin-top:18px;text-align:left;background:var(--soft)}
.winbar .tx{flex:1}
.winbar small,.facts small{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.winbar b{display:block;font-size:16px;font-weight:800;line-height:1.5}
.winbar .chev{font-size:22px;color:var(--sub)}
.facts{margin-top:6px}
.facts div{padding:16px 2px;border-bottom:1px solid var(--line)}
.facts div:last-child{border-bottom:0}
.facts b{display:block;font-size:16px;font-weight:700;line-height:1.5}
.facts span{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.lrow{display:flex;align-items:center;gap:16px;padding:16px 0;width:100%;text-align:left}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:#fff;display:flex;gap:10px;z-index:20;border-top:1px solid var(--line)}
.bar .sq{width:58px;height:58px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink)}
.bar .sq .gi{width:24px;height:24px}
.bar .go{flex:1;height:58px;border-radius:999px;background:var(--accent);color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 20px rgba(23,185,127,.28)}

/* ---------- Play ---------- */
.play{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;display:none;flex-direction:column;background:linear-gradient(180deg,var(--gl) 0%,#fff 100%)}
.play.on{display:flex;animation:fade .3s ease}
.ptop{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 4px}
.ptop b{font-size:17px;font-weight:800}
.phint{padding:12px 24px 0;font-size:21px;font-weight:800;line-height:1.45;text-align:center}
.pstage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:16px 18px}
.pmsg{padding:0 18px;min-height:58px;display:flex;align-items:center}
.pmsg div{width:100%;border-radius:18px;padding:14px 16px;font-size:17px;font-weight:800;line-height:1.5;background:#fff;text-align:center;animation:fade .25s;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.pmsg div.ok{background:var(--accent);color:#fff}
.pact{display:flex;gap:10px;padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
.btn{flex:1;min-width:0;height:56px;border-radius:18px;background:#fff;font-weight:800;font-size:17px;padding:0 14px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.btn.main{background:var(--accent);color:#fff}
.btn:disabled{opacity:.35}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.04)}

/* preview */
.pv{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:0 auto;border-radius:30px;background:#fff;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.07)}
.pv *{position:absolute}
.cap{margin-top:26px;text-align:center}
.cap b{display:block;font-size:21px;font-weight:800;min-height:30px;animation:fade .3s}
.cap .pd{display:flex;gap:8px;justify-content:center;margin-top:14px;position:static}
.cap .pd i{width:8px;height:8px;border-radius:8px;background:#E6DCD5;transition:.3s;display:block}
.cap .pd i.on{width:24px;background:var(--accent)}
/* a1 */
.a1c{top:46%;width:26%;height:30%;border-radius:16px;background:var(--gl);display:grid;place-items:center;font-weight:800;font-size:18px;animation:a1in 6s infinite both}
.a1c.me{background:var(--gc);color:#fff}
.a1c.x{animation:a1in 6s infinite both,a1x 6s infinite both}
.a1c.x::after{content:"";position:absolute;left:15%;top:50%;height:3px;background:var(--ink);border-radius:3px;animation:a1s 6s infinite both}
@keyframes a1in{0%{transform:translateY(40px);opacity:0}10%,100%{transform:none;opacity:1}}
@keyframes a1x{0%,30%{opacity:1;transform:none}34%{transform:translateX(-5px)}37%{transform:translateX(5px)}40%{transform:none}44%,100%{opacity:.3}}
@keyframes a1s{0%,38%{width:0}46%,100%{width:70%}}
.a1g{left:50%;top:9%;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.a1b{left:50%;top:12%;margin-left:36px;background:var(--accent);color:#fff;padding:9px 14px;border-radius:16px 16px 16px 4px;font-weight:800;font-size:17px;white-space:nowrap;transform-origin:left bottom;animation:a1p 6s infinite both}
@keyframes a1p{0%,64%{transform:scale(0)}72%{transform:scale(1.12)}76%,100%{transform:scale(1)}}
/* a2 */
.a2r{top:10%;width:22%;aspect-ratio:1;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;animation:a2h 6s infinite both}
.a2r:nth-of-type(1){left:9%}.a2r:nth-of-type(2){left:39%;animation-delay:2s}.a2r:nth-of-type(3){left:69%;animation-delay:4s}
@keyframes a2h{0%{transform:scale(.9);opacity:.35}5%,30%{transform:scale(1.12);opacity:1}35%,100%{transform:scale(.9);opacity:.35}}
.a2g{left:25%;top:44%;width:50%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;position:absolute}
.a2g i{position:relative;border-radius:8px;background:#F3EEEA}
.a2g i.k{animation:a2d 6s infinite both}
@keyframes a2d{0%,66%{transform:translateY(-40px);opacity:0}74%,94%{transform:none;opacity:1}100%{opacity:0}}
/* a3 */
.p3c{top:26%;width:27%;height:38%;border-radius:16px;background:var(--gl);display:grid;place-items:center;font-weight:800;font-size:17px}
.p3c svg{position:static;width:80%;height:auto}
.p3c:nth-of-type(1){left:4%;animation:p3a 6s infinite both}
.p3c:nth-of-type(2){left:36.5%;background:#fff;box-shadow:inset 0 0 0 2px var(--gl);animation:p3b 6s infinite both}
.p3c:nth-of-type(3){left:69%;animation:p3d 6s infinite both}
@keyframes p3a{0%{opacity:0;transform:translateY(20px)}8%,92%{opacity:1;transform:none}100%{opacity:0}}
@keyframes p3b{0%,30%{opacity:0;transform:translateY(20px)}38%,92%{opacity:1;transform:none}100%{opacity:0}}
@keyframes p3d{0%,60%{opacity:0;transform:translateY(20px)}68%,92%{opacity:1;transform:none}100%{opacity:0}}
.p3t{left:0;right:0;bottom:14%;text-align:center;font-weight:800;font-size:15px;color:var(--sub)}
/* a4 */
.a4c{width:17%;height:17%;border-radius:10px;background:#F2EEFB}
.a4c.w{background:#4A4160}
.a4c.e{background:var(--gl);animation:a4e 6s infinite both}
@keyframes a4e{0%,74%{box-shadow:none}80%,96%{box-shadow:0 0 0 4px var(--gc)}}
.a4s{width:8%;height:8%;border-radius:4px;background:var(--yellow);animation:a4f 6s infinite both}
@keyframes a4f{0%,34%{opacity:1;transform:none}40%,96%{opacity:0;transform:scale(1.6)}100%{opacity:1;transform:none}}
.a4p{width:11%;height:11%;border-radius:50%;background:var(--gc);box-shadow:0 4px 10px rgba(0,0,0,.15);animation:a4m 6s infinite both}
/* a5 */
.a5w{left:0;right:0;bottom:0;background:linear-gradient(180deg,#8FD3F5,#5BB7E8);animation:a5h 6s infinite both}
@keyframes a5h{0%,20%{height:22%}36%,60%{height:34%}74%,100%{height:28%}}
.a5i{bottom:0;width:30%;height:44%;background:var(--green);border-radius:50% 50% 0 0}
.a5k{top:50%;width:9%;height:6%;border-radius:4px;background:#B9845A;animation:a5p 6s infinite both}
@keyframes a5p{0%{opacity:0;transform:translateY(-20px)}100%{opacity:1;transform:none}}
.a5sun{left:62%;top:10%;width:20%;height:20%;border-radius:50%;background:var(--orange)}
.a5r{left:8%;top:10%;display:flex;gap:4px;position:absolute}
.a5r i{position:relative;width:12px;height:12px;border-radius:50%;background:#C89A6E;animation:a5u 6s infinite both}

/* intro preview */
.gpv{max-width:290px;margin-top:20px}
.gcap{text-align:center;font-size:17px;font-weight:800;margin:16px 0 22px;min-height:26px;animation:fade .3s}
/* maze game */
.mz-stat{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:12px}
.mz-stat div{padding:10px 12px;text-align:center}
.mz-stat b{display:block;font-size:21px;font-weight:800}
.mz-stat small{font-size:13px;color:var(--sub);font-weight:700}
.mz-stat .low b{color:#E0533D}
.mz{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}
.mz div{aspect-ratio:1;border-radius:11px;background:#F4F0FB;display:grid;place-items:center;font-size:13px;font-weight:800;position:relative}
.mz .w{background:#4A4160}
.mz .x{background:#D9D0FA}
.mz .it::after{content:"";width:40%;height:40%;border-radius:7px;background:var(--yellow);box-shadow:0 3px 6px rgba(245,166,35,.4)}
.mz .gl svg{width:52%;height:52%}
.mz-p{position:absolute;inset:16%;border-radius:50%;background:#7C66E8;box-shadow:0 4px 10px rgba(110,80,220,.4);transition:transform .28s ease-out;z-index:2}
.mates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mates button{height:78px;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.05);font-size:13px;font-weight:800}
.mates .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.mates .av{position:relative;background:none!important}.mates .av img{width:100%;height:100%;object-fit:contain}
.mates .av .ar{position:absolute;right:-6px;bottom:-4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff}
.mates .av .ar svg{width:11px;height:11px;fill:#fff}
.mates button:disabled{opacity:.35}

/* demo 1 */
.answer{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px}
.answer span{font-size:15px;color:var(--sub)}
.answer b{font-size:40px;letter-spacing:.12em}
.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.clue{padding:18px 6px;text-align:center;transition:.3s}
.clue span{display:block;font-size:13px;color:var(--sub);margin-bottom:8px}
.clue b{font-size:21px}
.clue.out{opacity:.35}
.clue.out b{text-decoration:line-through}
.clue.mine{box-shadow:inset 0 0 0 3px var(--gc)}
.pick{display:flex;gap:10px;margin-top:22px}
.pick button{flex:1;height:64px;border-radius:20px;background:var(--gc);color:#fff;font-size:21px;font-weight:800}
.guess{display:flex;gap:10px;margin-top:22px}
.guess input{flex:1;min-width:0;height:60px;border-radius:20px;border:0;padding:0 18px;font-size:21px;outline:none;background:#fff}
.guess button{width:90px;border-radius:20px;background:var(--accent);color:#fff;font-weight:800;font-size:17px}
/* demo 2 */
.bp-row{display:flex;gap:12px;align-items:stretch}
.bp{width:116px;flex:none;padding:8px}
.bp .g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.bp .g div{aspect-ratio:1;border-radius:7px;background:#F3EEEA}
.bp-text{flex:none;width:116px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.7;padding:10px;font-weight:700}
.bp-tog{flex:1;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.bp-tog .i3{width:40px;height:40px}
.build{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;margin-top:14px}
.build button{aspect-ratio:1;border-radius:14px;background:#F3EEEA;transition:background .15s}
.k-b{background:var(--blue)!important}.k-o{background:var(--orange)!important}.k-y{background:var(--yellow)!important}
.sw{display:flex;gap:10px;justify-content:center;margin-top:14px}
.sw i{width:26px;height:26px;border-radius:9px;background:#F3EEEA;display:block}
/* demo 3 */
.sk{fill:none;stroke:#3A3530;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.d3-pic{padding:14px 14px 10px;text-align:center}
.d3-pic small{display:block;font-size:14px;color:var(--sub);font-weight:700}
.d3-pic svg{width:100%;max-width:230px;height:auto;margin-top:6px}
.d3-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.d3-opts button{height:60px;border-radius:18px;background:var(--gc);color:#fff;font-size:18px;font-weight:800}
.chain{display:flex;flex-direction:column;gap:8px}
.chain .st{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px;animation:fade .4s both}
.chain .st img{width:38px;height:38px;object-fit:contain;flex:none}
.chain .st small{display:block;font-size:13px;color:var(--sub);font-weight:700}
.chain .st b{font-size:19px}
.chain .st svg{width:92px;height:69px;margin-left:auto;flex:none}
.chain .st.org{background:var(--gl)}
/* demo 4 */
.mstat{display:flex;gap:10px;margin-bottom:12px}
.mstat div{flex:1;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:15px}
.mstat b{font-size:21px}
.mstat .it{width:24px;height:24px;border-radius:8px;background:#E9E3DE}
.mstat .it.got{background:var(--yellow)}
.maze{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px}
.maze div{aspect-ratio:1;border-radius:14px;background:#F4F0FB;display:grid;place-items:center;font-size:13px;font-weight:800}
.maze .wall{background:#4A4160}
.maze .exit{background:#D9D0FA}
.maze .item i{width:42%;height:42%;border-radius:8px;background:var(--yellow);display:block}
.piece{width:62%;height:62%;border-radius:50%;background:var(--purple);animation:pop .25s;box-shadow:0 4px 10px rgba(120,90,200,.35)}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.pad button{height:70px;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.pad button .gi{width:30px;height:30px}
.pad button .gi svg{fill:#6E5CC0}
.pad button:disabled{opacity:.35}
/* demo 5 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:20px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:32px;font-weight:800;line-height:1.1}
.stat span{font-size:15px;font-weight:700;color:var(--sub)}
.goal{text-align:center;font-size:15px;font-weight:800;color:var(--sub);margin:14px 0 2px}
.scene{text-align:center;font-size:17px;margin:10px 0 4px;line-height:1.6}
.opt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:20px;padding:16px;margin-top:10px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.opt b{font-size:17px;font-weight:800}
.opt .d{display:flex;gap:5px;flex:none}
.opt .d span{font-size:13px;padding:5px 8px;border-radius:9px;font-weight:800}
.opt:disabled{opacity:.35}
.logs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.logs div{font-size:15px;padding:12px 16px;font-weight:600}

/* demo 6 */
.m6-mates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m6-mate{padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.m6-mate img{width:44px;height:44px;object-fit:contain}
.cd{display:grid;place-items:center;color:#fff;font-weight:800;background:var(--gc);border-radius:10px}
.cd.back{background:repeating-linear-gradient(45deg,var(--gc) 0 6px,#F8CF6A 6px 12px)}
.cd.out{opacity:.25}
.m6-mate .cd{margin-left:auto;width:40px;height:56px;font-size:17px}
.m6-pile{margin:14px 0;padding:18px;text-align:center}
.m6-pile .seq{display:flex;justify-content:center;gap:8px;min-height:72px;align-items:center}
.m6-pile .seq i{font-style:normal;width:50px;height:70px;border-radius:12px;background:var(--gl);display:grid;place-items:center;font-weight:800;font-size:21px;animation:pop .25s}
.m6-pile .seq i.bad{background:#FFE1DC;color:#D9483B}
.m6-pile small{display:block;margin-top:10px;font-size:13px;color:var(--sub);font-weight:700}
.m6-me{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.m6-me img{width:78px}
.m6-me .cd{width:84px;height:116px;border-radius:18px;font-size:40px;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.m6-me .lb{font-size:13px;color:var(--sub);font-weight:700;text-align:center;margin-top:6px}
.a6c{width:20%;height:30%;border-radius:12px;background:var(--gc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 6px 14px rgba(0,0,0,.10)}
.a6h{left:0;right:0;bottom:9%;text-align:center;font-weight:800;font-size:15px;color:var(--sub)}

/* ---------- Guide ---------- */
.ghd{padding:16px 22px 20px}
.ghd small{font-size:15px;color:var(--sub);font-weight:600}
.ghd h1{margin:4px 0 0;font-size:28px;font-weight:800}
.timeline{position:relative;padding:4px 0}
.timeline::before{content:"";position:absolute;left:19px;top:30px;bottom:30px;width:3px;background:var(--accent-l);border-radius:3px}
.tl{display:flex;gap:16px;align-items:center;padding:12px 0;position:relative}
.tl em{font-style:normal;width:40px;height:40px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:0 0 0 5px #fff}
.tl p{margin:0;font-size:17px;line-height:1.55;font-weight:600}
.gnote{margin:18px 22px 0;font-size:15px;color:var(--sub);line-height:1.6;text-align:center}

.mask{position:fixed;inset:0;background:rgba(43,37,34,.38);z-index:60;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.pop{width:100%;max-width:440px;max-height:86vh;overflow-y:auto;background:#fff;border-radius:30px 30px 0 0;padding:14px 22px calc(26px + env(safe-area-inset-bottom));animation:up .3s ease}

.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 20px}
.pop h3{margin:0 0 16px;font-size:21px;font-weight:800}
.pop .close{width:100%;margin-top:22px;background:var(--soft);box-shadow:none}

.olist li{display:flex;gap:14px;align-items:center;padding:13px 0;font-size:17px;line-height:1.55}
.olist li+li{border-top:1px solid var(--line)}
.olist em{font-style:normal;width:30px;height:30px;flex:none;border-radius:50%;background:var(--accent-l);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px}
.props{margin-top:14px;font-size:15px;color:var(--sub);line-height:1.6}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:11px 10px;border-radius:999px;font-size:15px;color:var(--sub);font-weight:800}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.06)}

.quote{border-radius:22px;font-size:21px;font-weight:800;line-height:1.6;padding:24px 22px;background:var(--gl)}
.ti{padding:16px 0}
.ti+.ti{border-top:1px solid var(--line)}
.ti b{display:block;font-size:15px;font-weight:800;color:var(--sub);margin-bottom:6px}

let cur=null;

function route(){
  const h = location.hash.replace('#','');
  const m = h.match(/^(game|play)\/([1-6])$/);
  closeSheet(); stopPreview(); Object.values(DEMOS).forEach(d=>d.stop&&d.stop());
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  $('#play').classList.remove('on');
  $('#bar').classList.toggle('hide',!m);
  document.body.style.overflow='';
  if(m){
    const id=+m[2];
    if(!cur||cur.id!==id||!$('#v-game').innerHTML) renderGame(id);
    $('#v-game').classList.add('on');
    if(m[1]==='play') openPlay(); else startCaption();
  }else{
    $('#v-'+(h==='guide'?'guide':'home')).classList.add('on');
  }
  if(!m || m[1]==='game') window.scrollTo(0,0);
}

 1:{ init(){this.s={pick:null,res:null,reveal:false,guess:''}},

 },
 2:{ T:['','','','','b','','o','b','y'], C:['','b','o','y'],

 3:{ OPT:{'下午茶':['tea','下午茶'],'喝咖啡':['coffee','提神飲料'],'早餐':['egg','吐司']},

 4:{ N:5, LV:[{items:1,walls:5,time:45},{items:2,walls:6,time:50},{items:3,walls:7,time:55}],
  D:[['up',-1,0,0,'小橘','#FF9A5C','coral'],['right',0,1,90,'小藍','#5B9BF5','fluffy'],['down',1,0,180,'小綠','#5CC08A','jelly'],['left',0,-1,270,'小紫','#9B87F5','quarter']],
  stop(){ clearInterval(this.t) },
  slide(p,dr,dc,walls){ const N=this.N, path=[]; let r=Math.floor(p/N), c=p%N;
    while(true){ const nr=r+dr, nc=c+dc; if(nr<0||nr>=N||nc<0||nc>=N||walls.has(nr*N+nc)) break; r=nr;c=nc;path.push(r*N+c); }
    return path; },
  solve(m){ const full=(1<<m.items.length)-1, seen=new Set(['0,0']); let q=[[0,0]], depth=0;
    while(q.length&&depth<16){ depth++; const nq=[];
      for(const [p,mask] of q) for(const d of this.D){ const path=this.slide(p,d[1],d[2],m.walls); if(!path.length) continue;
        let mk=mask; for(const c of path){ const k=m.items.indexOf(c); if(k>=0) mk|=1<<k; if(c===m.exit&&mk===full) return depth; }
        const e=path[path.length-1], key=e+','+mk; if(!seen.has(key)){seen.add(key);nq.push([e,mk])} }
      q=nq; }
    return 0; },
  gen(lv){ const N=this.N, L=this.LV[lv], exit=N*N-1;
    for(let t=0;t<500;t++){
      const free=[...Array(N*N).keys()].filter(i=>i!==0&&i!==exit).sort(()=>Math.random()-.5);
      const walls=new Set(free.slice(0,L.walls)), items=free.slice(L.walls,L.walls+L.items), glass=free[L.walls+L.items];
      const m={walls,items,glass,exit}, par=this.solve(m);
      if(par>=L.items+2&&par<=L.items+7){m.par=par;return m}
    }
  },
  init(lv){ this.stop(); lv=lv||0; this.s={lv,map:this.gen(lv),pos:0,got:[],time:this.LV[lv].time,moves:0,state:'play',glass:false,m:''};
    this.t=setInterval(()=>{const s=this.s; if(s.state!=='play')return this.stop(); s.time--;
      const el=$('#mzt'); if(el){el.textContent=s.time+' 秒';el.parentElement.classList.toggle('low',s.time<=10)}
      if(s.time<=0){s.state='lose';s.m='時間到了，再試一次';this.stop();this.render()} },1000); },
  render(){
    const s=this.s, m=s.map, N=this.N, L=this.LV[s.lv];
    const old=document.querySelector('.mz-p')?.getBoundingClientRect();
    let cells='';
    for(let i=0;i<N*N;i++){
      let cls=m.walls.has(i)?'w':(i===m.exit?'x':''), inner='';
      if(m.items.includes(i)&&!s.got.includes(i)) cls+=' it';
      if(i===m.glass&&!s.glass){cls+=' gl';inner='<svg viewBox="0 0 24 24"><path d="M6 3h12v3l-4.5 6 4.5 6v3H6v-3l4.5-6L6 6z" fill="#C89A6E"/></svg>'}
      if(i===m.exit) inner='出口';
      if(i===s.pos) inner+='<span class="mz-p"></span>';
      cells+=`<div class="${cls}">${inner}</div>`;
    }
    const play=s.state==='play', last=s.lv===this.LV.length-1;
    paint({
      hint:`第 ${s.lv+1} 關　拿 ${L.items} 個物資再到出口`,
      stage:`<div class="mz-stat"><div class="card ${s.time<=10?'low':''}"><b id="mzt">${s.time} 秒</b><small>沙漏</small></div>
          <div class="card"><b>${s.got.length}/${L.items}</b><small>物資</small></div><div class="card"><b>${s.moves}</b><small>步數</small></div></div>
        <div class="card mz">${cells}</div>
        <div class="mates">${this.D.map(d=>`<button data-a="mv" data-v="${d[0]}" ${play?'':'disabled'}><span class="av">${chImg(d[6])}<span class="ar" style="background:${d[5]}">${GL.up.replace('<svg','<svg style="transform:rotate('+d[3]+'deg)"')}</span></span>${d[4]}</button>`).join('')}</div>`,
      msg:s.m, ok:s.state==='win',
      act: s.state==='win' ? (last? B('restart','從第 1 關再玩')+TALK : B('again','再玩一次')+B('next','下一關',true))
          : B('again',s.state==='lose'?'再試一次':'換張地圖')
    });
    const p=document.querySelector('.mz-p');
    if(old&&p){const n=p.getBoundingClientRect(); p.style.transition='none'; p.style.transform=`translate(${old.left-n.left}px,${old.top-n.top}px)`; p.offsetHeight; p.style.transition=''; p.style.transform='';}
  },
  act(a,v){ const s=this.s;
    if(a==='again'){this.init(s.lv);return this.render()}
    if(a==='next'){this.init(s.lv+1);return this.render()}
    if(a==='restart'){this.init(0);return this.render()}
    if(a!=='mv'||s.state!=='play')return;
    const d=this.D.find(x=>x[0]===v), m=s.map, path=this.slide(s.pos,d[1],d[2],m.walls), L=this.LV[s.lv];
    if(!path.length){s.m=`${d[4]}推不動，換位隊友`;return this.render()}
    s.moves++; s.m='';
    for(const c of path){
      if(m.items.includes(c)&&!s.got.includes(c)){s.got.push(c);s.m='拿到物資'}
      if(c===m.glass&&!s.glass){s.glass=true;s.time+=10;s.m='翻轉沙漏，多 10 秒'}
      if(c===m.exit&&s.got.length===L.items){s.pos=c;s.state='win';this.stop();
        s.m=`過關！用了 ${s.moves} 步，最少 ${m.par} 步`;return this.render()}
    }
    s.pos=path[path.length-1];
    if(s.pos===m.exit&&s.got.length<L.items) s.m='還有物資沒拿';
    this.render()}
 },
 5:{ R:[
   {t:'登上河岸',d:'繩橋還沒架好，水也慢慢漲了',o:[['綁上木板',-2,2,1],['堆起沙包',-1,0,-1],['原地等雨',0,0,2]]},

    s.r++;
    if(s.r===3){s.water=Math.max(0,s.water);s.end=(s.bridge>=4&&s.water<=3)?'win':'lose'}

 },
 6:{ MATES:[['小橘','coral'],['小藍','fluffy']],
  init(){ this.stop(); const n=[];
    while(n.length<3){const x=4+Math.floor(Math.random()*93); if(n.every(y=>Math.abs(y-x)>=10)) n.push(x)}
    this.s={me:n[0],mine:true,bots:[n[1],n[2]],held:[true,true],pile:[],state:'ready',m:''} },
  stop(){ (this.ts||[]).forEach(clearTimeout); this.ts=[] },
  start(){ const s=this.s; s.state='run'; this.ts=[];
    const order=[0,1].sort((a,b)=>s.bots[a]-s.bots[b]); let last=0;
    order.forEach(i=>{ last=Math.max(last+500, 900+s.bots[i]*80+(Math.random()*500-250)); this.ts.push(setTimeout(()=>this.bot(i),last)) });
    this.render() },
  bot(i){ const s=this.s; if(s.state!=='run')return;
    const v=s.bots[i]; s.held[i]=false;
    if(s.mine&&s.me<v){ s.pile.push({v,bad:true}); return this.end(`${this.MATES[i][0]}出了 ${v}，但你的 ${s.me} 比較小`) }
    s.pile.push({v}); this.check() },
  check(){ const s=this.s; if(!s.mine&&!s.held.includes(true)){ s.state='win'; s.m='三張牌由小到大出完了'; this.stop() } this.render() },
  end(m){ const s=this.s; s.state='lose'; s.m=m; this.stop(); this.render() },
  render(){ const s=this.s, show=s.state==='lose'||s.state==='win';
    const H={ready:'不說話，感覺時機<br>覺得你最小時就出牌',run:'安靜……',win:'默契滿分',lose:'順序亂掉了'};
    paint({hint:H[s.state],
      stage:`<div class="m6-mates">${this.MATES.map(([nm,ch],i)=>`<div class="card m6-mate">${chImg(ch)}${nm}<span class="cd ${s.held[i]&&!show?'back':''} ${!s.held[i]?'out':''}">${s.held[i]&&!show?'':s.bots[i]}</span></div>`).join('')}</div>
        <div class="card m6-pile"><div class="seq">${s.pile.map(p=>`<i class="${p.bad?'bad':''}">${p.v}</i>`).join('')||'<small>桌上還沒有牌</small>'}</div>${s.pile.length?'<small>桌上的牌</small>':''}</div>
        <div class="m6-me"><div><span class="cd ${s.mine?'':'out'}">${s.me}</span><div class="lb">你的牌</div></div>${chImg('corn')}</div>`,
      msg:s.m, ok:s.state==='win',
      act: s.state==='ready'? B('go','開始',true) : s.state==='run'? B('play','出牌',true) : B('go','再玩一次')+TALK });
  },
  act(a){ const s=this.s;
    if(a==='go'){ if(s.state!=='ready') this.init(); return this.start() }
    if(a==='play'&&s.state==='run'&&s.mine){
      const low=s.bots.map((v,i)=>s.held[i]&&v<s.me?i:-1).filter(i=>i>=0);
      s.mine=false; s.pile.push({v:s.me,bad:low.length>0});
      if(low.length) return this.end(`${this.MATES[low[0]][0]}手上的 ${s.bots[low[0]]} 比較小，還要再等等`);
      this.check() }
  }
 }

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.game) return go('game/'+d.game);
  if(d.go) return go(d.go);
  if(d.step!==undefined){
    gameStep=+d.step;drawGameTrack();
    return;
  }
  if(d.seg){talkTab=d.seg;document.querySelectorAll('[data-seg]').forEach(b=>b.classList.toggle('on',b.dataset.seg===talkTab));$('#pane').innerHTML=paneHTML();return}
  if(d.act){
    if(d.act==='home') return go('');
    if(d.act==='play') return go('play/'+cur.id);
    if(d.act==='exit') return go('game/'+cur.id);
    if(d.act==='rules') return rulesSheet();
    if(d.act==='talk') return talkSheet();
    if(d.act==='close') return closeSheet();
  }
  if(d.a==='skip'||d.a==='start') return startGame();
  if(d.a && cur) DEMOS[cur.id].act(d.a,d.v);
});
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gin')DEMOS[1].act('guess')});
route();
</script>
